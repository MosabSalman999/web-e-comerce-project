<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Screen</title>
    <link rel="stylesheet" href="style.css">
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #000000;
        padding: 40px;
    } 

    .product-container {
        display: flex;
        align-items: flex-start;
        border-radius: 6px;
        border: 4px solid #0dd511;
        padding: 25px;
        max-width: 800px;
        margin: auto;
        background-color: #000000;
        margin-bottom: -25px;
    }

    .product-left {
        flex: 1;
    }

    .product-image {
        width: 500px;
        height: 500px;
        background-color: #ddd;
        display: block;
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        padding: 10px;
        font-size: 20px;
        background-color: #1e2a22;  
        color: #ffffff;
        border: 1px solid #00ff88;
        border-radius: 8px;          
        resize: vertical;      
        margin-left: 50;  
    }

    .description li {
        border-bottom: 1px solid #000;
        margin-bottom: 5px;
        padding-bottom: 5px;
    }

    .product-info h2 {
        position: bottom;
    }

    .divider {
        width: 1px;
        background-color: #FFFFFF;
        height: auto;
        margin: 0 20px;
    }

    .product-right {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .add-to-cart {
        padding: 10px 20px;
        background-color: #32CD32;
        border: none;
        cursor: pointer;
        margin-bottom: 20px;
        margin-left: 0px;
    }

    .close-button {
        position: fixed;
        top: 20px;
        right: 30px;
        font-size: 32px;
        text-decoration: none;
        color: #FFFFFF;
        font-weight: bold;
        transition: color 0.3s;
        z-index: 1000;
    }

    .close-button:hover {
        color: #1aff9a;
    }

    .image-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .product-label {
        font-weight: bold;
        font-size: 18px;
        color: #FFFFFF; /* optional if you're using a dark theme */
        display: block;
        margin-bottom: 8px;
    }


</style>
</head>
    <body>
        <a href="login.php" class="close-button">&times;</a>
        <div class="product-container">
            <div class="product-left">
                <div class="image-wrapper">
                    <img src="/home/nabeel_okal/PicsforWeb/headset1.png" alt="Product Image" class="product-image">
                  </div>                  
                  <label class="product-label">Description:</label>
                            <textarea name="description" rows="3" cols="50" readonly>
8 GB of RAM
More Info...
                            </textarea>
            <div class="product-info">
                <h2>Flash Drive</h2>
                <p>$7.99</p>
            </div>
            <div class="product-right">
                <button class="add-to-cart">Add to Cart</button>
                <!-- <div class="option-box"></div> -->
            </div>
        </div>
    </div>
    </body>
</body>
</html>
